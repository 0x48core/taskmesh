# Local stack: postgres for now; taskmesh, prometheus and grafana join in later phases.
name: taskmesh

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: taskmesh
      POSTGRES_PASSWORD: taskmesh
      POSTGRES_DB: taskmesh
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>/, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmesh -d taskmesh"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
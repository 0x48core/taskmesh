name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIGRATE: go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taskmesh
          POSTGRES_PASSWORD: taskmesh
          POSTGRES_DB: taskmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmesh -d taskmesh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DB_URL: postgres://taskmesh:taskmesh@localhost:5432/taskmesh?sslmode=disable
      TEST_DATABASE_URL: postgres://taskmesh:taskmesh@localhost:5432/taskmesh?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      # Up, down, up again: proves the down migration works and leaves the schema in place for tests.
      - name: Migrations
        run: |
          make migrate
          make migrate-down
          make migrate

      - name: Test
        run: make test
